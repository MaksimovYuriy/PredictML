[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictml-serviceflow"
version = "0.1.0"
description = "Standalone extraction of ServiceFlow forecasting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "torch>=2.1,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
predictml = "predictml.cli:main"

[tool.setuptools.packages.find]
include = ["predictml*"]
