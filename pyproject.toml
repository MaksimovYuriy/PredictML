[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictml-serviceflow"
version = "0.1.0"
description = "Standalone extraction of ServiceFlow forecasting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "torch>=2.1,<3", "scikit-learn>=1.6,<2", "openpyxl>=3.1.5,<4", "joblib>=1.6,<2", "streamlit>=1.67,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
predictml = "predictml.cli:main"

[tool.setuptools.packages.find]
include = ["predictml*"]

[tool.setuptools.package-data]
predictml = ["data/examples/raw/*.csv", "data/examples/tabular/*.csv", "data/examples/tabular/*.xlsx", "data/examples/tabular/*.json", "data/examples/tabular/*.md"]
